# docker-compose.yml — local/production packaging for @lkb/api and @lkb/web.
#
# Mongo is NOT containerized here on purpose: production data lives in the real shared cluster
# (`MONGODB_URL` in .env). D-173 requires an explicit approved staging target for acceptance;
# production `lkb` retains its separate opt-in. `local-mongo` below is an OPT-IN profile for
# a fully offline dev loop against empty local data, never started by a plain `docker compose up`.
services:
  # One-shot schema migration (migrate-mongo up). OPT-IN: it sits behind the `migrate` profile, so
  # a plain `docker compose up` never writes to a database schema, and api does not depend on it.
  # Run it deliberately, once, with:
  #   docker compose --profile migrate run --rm migrate
  # Running it against the production database needs the owner's approval (D-117: production DB
  # writes are not authorized). config/migrate-mongo-config.cjs has NO default database (ISS-SCRIPTGUARDS-001):
  # you must pass the target explicitly, and `lkb` additionally needs the production opt-in:
  #   MONGODB_DB=lkb_work_x docker compose --profile migrate run --rm migrate          # isolated work DB
  #   MONGODB_DB=lkb LKB_I_KNOW_THIS_IS_PRODUCTION=1 docker compose --profile migrate run --rm migrate   # production, deliberate
  # (an opt-in alone, or MONGODB_DB=lkb alone, is refused; so is an unset MONGODB_DB).
  # Built from the root Dockerfile's `build` stage (full pnpm install: workspace node_modules incl.
  # migrate-mongo and dotenv at /app/node_modules). Migration scripts, config and schema are
  # bind-mounted read-only. NOTE: relies on the stage name `build` (ISS-DEPLOYCOMPOSE-001).
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    working_dir: /app
    command: ["npx", "migrate-mongo", "up", "-f", "config/migrate-mongo-config.cjs"]
    environment:
      MONGODB_URL: ${MONGODB_URL:?set MONGODB_URL (see .env's MONGODB_URL)}
      # No default (ISS-SCRIPTGUARDS-001): the caller names the database every run. `lkb` also needs the opt-in below.
      MONGODB_DB: ${MONGODB_DB:?set MONGODB_DB explicitly (no default; lkb also needs LKB_I_KNOW_THIS_IS_PRODUCTION=1)}
      LKB_I_KNOW_THIS_IS_PRODUCTION: ${LKB_I_KNOW_THIS_IS_PRODUCTION:-}
      LKB_ALLOW_STAGING: ${LKB_ALLOW_STAGING:-}
    volumes:
      - ./migrations:/app/migrations:ro
      - ./config/migrate-mongo-config.cjs:/app/config/migrate-mongo-config.cjs:ro
      # Four of the five migrations read <__dirname>/../schema/index.json (= /app/schema/index.json);
      # the `build` stage does not copy schema/ (only the runtime stage does) (ISS-DEPLOYCOMPOSE-006).
      - ./schema:/app/schema:ro
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "3300:3300"
    environment:
      MONGODB_URL: ${MONGODB_URL:?set MONGODB_URL (see .env's MONGODB_URL)}
      # D-173: the caller must name the target; staging never silently writes to production.
      MONGODB_DB: ${MONGODB_DB:?set MONGODB_DB explicitly (use an approved staging database for acceptance)}
      LKB_I_KNOW_THIS_IS_PRODUCTION: ${LKB_I_KNOW_THIS_IS_PRODUCTION:-}
      LKB_ALLOW_STAGING: ${LKB_ALLOW_STAGING:-}
      # The web origin (WEB_PORT) must be listed here: nginx has no /api proxy, so the browser
      # calls api directly (cross-origin).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      # Text uses Ollama Cloud; Gemini remains optional until an audio task needs it.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?set OLLAMA_API_KEY}
      OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL:-https://ollama.com}
      OLLAMA_CLOUD_MODEL: ${OLLAMA_CLOUD_MODEL:-glm-5.3-flash}
      OLLAMA_CLOUD_VERIFIER_MODEL: ${OLLAMA_CLOUD_VERIFIER_MODEL:-deepseek-v4.1-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Cross-host Calendar is explicitly bound to a dedicated active worker key (D-192).
      LKB_CALENDAR_WORKER_ENABLED: ${LKB_CALENDAR_WORKER_ENABLED:-0}
      LKB_CALENDAR_WORKER_BINDINGS: ${LKB_CALENDAR_WORKER_BINDINGS:-}
      LKB_JOIN_RULES_ENABLED: ${LKB_JOIN_RULES_ENABLED:-0}
      LKB_JOIN_RULES_STATE_DIR: /var/lib/lkb/join-rules
      PORT: 3300
      # T-028 (D-189) and WhatsApp, read from the MAIN .env (gate 2026-10-28: "main .env mai hi rakho").
      # Value-less pass-through ("NAME:" with no value): a name ABSENT from .env stays UNDEFINED in the container.
      # Never write ${NAME:-} for these: that defines an empty string. The API treats a defined-but-incomplete
      # T-028 value (even "") as a misconfiguration and answers auth routes 503, and WHATSAPP_MONGO_URL="" would
      # defeat the 127.0.0.1:27018 default. Set all five T-028 names together or none, and never leave a blank NAME= line in .env
      # (a blank line DEFINES an empty string; comment the line out or delete it instead).
      LKB_HOSTING_STATE_DIR:
      LKB_COUNSELLOR_STATE_DIR:
      LKB_HOSTING_ENCRYPTION_KEY:
      LKB_HOSTING_BOOTSTRAP_ADMINS:
      LKB_HOSTING_WEBHOOK_ORIGINS:
      WHATSAPP_MONGO_URL:
      WHATSAPP_MONGO_DB:
      WHATSAPP_TENANT_OWNER_MAP:
    # No env_file on purpose. (1) Passing the whole .env would leak MONGO_WORK_DB and the
    # LKB_I_KNOW_THIS_IS_PRODUCTION handling into the container. (2) The old optional .env.t028 file is retired: a
    # value-less environment entry that is unresolved renders as null and SHADOWS an env_file value, so the file
    # would silently do nothing. Move any .env.t028 lines into the main .env.
    volumes:
      - lkb-hosting-state:/var/lib/lkb/hosting
      - lkb-counsellor-state:/var/lib/lkb/counsellor
      - lkb-join-rules-state:/var/lib/lkb/join-rules
    restart: unless-stopped

  # Static SPA behind nginx (root Dockerfile's `web` target). VITE_API_BASE_URL is BAKED INTO THE BUNDLE at
  # build time, so it must be the URL the BROWSER uses to reach api (not the compose-internal name).
  # OWNER DECISIONS (placeholders, not decided here): public hostnames, exposed ports, TLS.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3300}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  local-mongo:
    image: mongo:7
    profiles: ["local-dev"]
    ports:
      - "27018:27017"
    volumes:
      - lkb-local-mongo:/data/db

volumes:
  lkb-hosting-state:
  lkb-counsellor-state:
  lkb-local-mongo:
  lkb-join-rules-state:
