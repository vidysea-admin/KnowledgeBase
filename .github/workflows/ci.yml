# .github/workflows/ci.yml — T-017 C9. Same sequence as ARCHITECTURE §5 "Structure holds iff".
name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Without this a hung test (e.g. a stuck ffmpeg/browser child) runs to GitHub's 6-hour default.
    # 45 minutes is well above the expected 10-20 minute runtime of this single job, so it only ever trips on a hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # sources/whatsapp_msg is referenced, never built here (D-003)

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Python validator deps
        run: python -m pip install --quiet jsonschema

      # ISS-WEBFIXTURE-001: apps/api activity-health router.test.ts runs workers/transcribe/src/job_queue.py
      # through the interpreter named by D2_FIXTURE_PYTHON (set on the Unit tests step); it imports pymongo
      # and jsonschema. Uses the worker's own pinned requirements file. setup-python 3.12 matches the local .venv.
      - name: Python deps for the D2 queue fixture test
        run: python -m pip install --quiet -r workers/transcribe/requirements.txt

      # Tests shell out to ffmpeg/ffprobe (capture/record-backend remux test, upload, watch, ingest
      # chain, process-video). ubuntu-latest does not guarantee them, so install explicitly.
      - name: Install ffmpeg (provides ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # The remux test needs libvpx (VP8/VP9) and libopus encoders. Fail here, with a clear message,
      # if the packaged build lacks them, instead of as a confusing test failure later.
      - name: Check ffmpeg encoders
        run: |
          missing=0
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "::error::ENVIRONMENT PROBLEM, not a test failure: ffmpeg is not on PATH in this CI runner."
            exit 1
          fi
          if ! command -v ffprobe >/dev/null 2>&1; then
            echo "::error::ENVIRONMENT PROBLEM, not a test failure: ffprobe is not on PATH in this CI runner (the record-backend test uses it)."
            missing=1
          fi
          if ! encoders="$(ffmpeg -hide_banner -encoders 2>&1)"; then
            echo "::error::ENVIRONMENT PROBLEM, not a test failure: 'ffmpeg -hide_banner -encoders' failed on this CI runner."
            exit 1
          fi
          for enc in libvpx libopus; do
            if ! printf '%s\n' "$encoders" | awk -v e="$enc" '$2 == e {found=1} END {exit !found}'; then
              echo "::error::ENVIRONMENT PROBLEM, not a test failure: the CI runner's ffmpeg build lacks the $enc encoder the record-backend remux test needs."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "ffmpeg, ffprobe, libvpx and libopus all present."

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        env:
          # No .venv/Scripts/python.exe on ubuntu; use the setup-python interpreter on PATH.
          D2_FIXTURE_PYTHON: python
        run: pnpm -r test

      - name: Generated types match schema/
        run: pnpm gen:types --check

      - name: Schema fixtures validate
        run: python schema/validate.py

      - name: Structure budgets + dependency rules
        run: pnpm lint:structure

      # ISS-058: catalogue-score --check only means something against COMMITTED state, so it
      # runs here on the commit/CI path rather than inside lint:structure, which stays runnable
      # at any moment during an in-flight unit.
      - name: Catalogue score reproducibility
        run: pnpm lint:score

      - name: Linter negative tests
        run: pnpm test:lint
