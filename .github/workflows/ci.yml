# .github/workflows/ci.yml — T-017 C9. Same sequence as ARCHITECTURE §5 "Structure holds iff".
name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Without this a hung test (e.g. a stuck ffmpeg/browser child) runs to GitHub's 6-hour default.
    # 30 minutes is several times the expected runtime of this single job, so it only ever trips on a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # sources/whatsapp_msg is referenced, never built here (D-003)

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Python validator deps
        run: python -m pip install --quiet jsonschema

      # Tests shell out to ffmpeg/ffprobe (capture/record-backend remux test, upload, watch, ingest
      # chain, process-video). ubuntu-latest does not guarantee them, so install explicitly.
      - name: Install ffmpeg (provides ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # The remux test needs libvpx (VP8/VP9) and libopus encoders. Fail here, with a clear message,
      # if the packaged build lacks them, instead of as a confusing test failure later.
      - name: Check ffmpeg encoders
        run: |
          ffmpeg -version
          ffprobe -version
          if ! ffmpeg -hide_banner -encoders | grep -E "libvpx|libopus"; then
            echo "::error::ENVIRONMENT PROBLEM, not a test failure: this ffmpeg build lacks the libvpx/libopus encoders the record-backend remux test needs."
            exit 1
          fi

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Generated types match schema/
        run: pnpm gen:types --check

      - name: Schema fixtures validate
        run: python schema/validate.py

      - name: Structure budgets + dependency rules
        run: pnpm lint:structure

      # ISS-058: catalogue-score --check only means something against COMMITTED state, so it
      # runs here on the commit/CI path rather than inside lint:structure, which stays runnable
      # at any moment during an in-flight unit.
      - name: Catalogue score reproducibility
        run: pnpm lint:score

      - name: Linter negative tests
        run: pnpm test:lint
