# config/ai-routing.yaml — T-019 C4. Per-jobKind ordered provider chain, user-editable
# (length >= 1, no hardcoded max). Gemini first per D-005/D-008. Parsed by
# packages/ai/src/routing-config.ts (flat `key: [a, b, c]` shape only — no nesting).
transcribe: [gemini, ollama, claude-code]
namemap: [gemini, claude-code]
summarize: [gemini, claude-code, ollama]
claims: [gemini, claude-code]
# speakers: the speaker-segment-identity gate (Option A, phase 2, answered 2026-09-21) pins
# transcript-derived speaker identity to the LOCAL chain — qwen3:8b first, deterministic options —
# so nothing model-proposed about a person's identity is adjudicated by a public model. Ollama is
# the only member that can satisfy that today; gemini/claude-code stay off this jobKind.
speakers: [ollama]
tree-summary: [gemini, claude-code]
evaluator: [gemini, claude-code]
answer: [gemini, claude-code, ollama]
ask: [gemini, claude-code]
# U1.1: embeddings. Gemini first per D-005; ollama second so the vector index can be built
# entirely locally when the corpus must not leave our infrastructure (goal.md). Providers without
# an embed() are skipped by the router rather than failing the chain, so listing one is harmless.
embedding: [gemini, ollama]
# T-040 / D-144: the negation-safety JUDGE. A SECOND model (not the generating summarize/claims chain, which is
# gemini-first) checks each generated note against its cited source sentence(s) for same/different/unsure meaning,
# polarity and negation included. claude-code first so the judge is a different model family from the generator;
# gemini is the fallback. Job kind "note-judge" (packages/index/src/pipeline/notes/judge.ts). No existing route changed.
note-judge: [claude-code, gemini]
