# apps/web/nginx.conf -- envsubst TEMPLATE for the @lkb/web image (rendered at container start by the
# official nginx entrypoint into /etc/nginx/conf.d/default.conf). Variables come from
# apps/web/docker/18-lkb-base-path.envsh, derived from the runtime env:
#   ${PORT}               listen port (default 80)
#   ${LKB_BASE_PATH}      "" (app at "/") or "/knowledgebase" (APP_BASE_PATH, no trailing slash)
#   ${LKB_DOC_ROOT}       document root such that <root>${LKB_BASE_PATH}/index.html is the SPA entry
#   ${LKB_API_UPSTREAM}   where <base>/api/* is proxied, prefix stripped (API_UPSTREAM, default http://api:3300)
# nginx's own $variables are untouched (envsubst only replaces names that are defined in the environment).
server {
  listen ${PORT};
  root ${LKB_DOC_ROOT};
  index index.html;
  # Redirects, if any, stay relative: the public host/port is the front proxy's, not ours.
  absolute_redirect off;
  client_max_body_size 1g;

  # Container health probe: independent of the base path.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # API: <base>/api/* -> api service, with "<base>/api/" replaced by "/" (the URI part of proxy_pass).
  location ^~ ${LKB_BASE_PATH}/api/ {
    proxy_pass ${LKB_API_UPSTREAM}/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # The base path itself, with no trailing slash (e.g. /knowledgebase). For a root deployment this
  # pattern is "^$" and can never match a request.
  location ~ ^${LKB_BASE_PATH}$ {
    try_files ${LKB_BASE_PATH}/index.html =404;
  }

  # SPA fallback: any path under the base that isn't a real static file resolves to the SPA entry so
  # react-router's client-side routes (a direct load of <base>/sessions, a refresh on <base>/brain) work.
  # Real files (<base>/assets/*, <base>/config.js) are served as-is.
  location ${LKB_BASE_PATH}/ {
    try_files $uri $uri/ ${LKB_BASE_PATH}/index.html;
  }
}
