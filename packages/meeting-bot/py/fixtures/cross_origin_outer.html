<!doctype html>
<!-- ISS-U0-1 fixture: the iframe's src is served from a different host (127.0.0.1 vs
     localhost) on the SAME port, so the browser treats it as a different origin even though
     one Python http.server process answers both. contentDocument access on this frame must
     raise (or return null) and be skipped silently, never propagate out of execute_script. -->
<html>
<head><title>cross-origin-outer</title></head>
<body>
  <a href="#">Back</a>
  <iframe id="xo" src="http://127.0.0.1:__PORT__/inner.html" style="width:640px;height:480px;border:0;"></iframe>
</body>
</html>
