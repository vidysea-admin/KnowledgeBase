<!doctype html>
<!-- zoomwebinar: web-client join page ("Join from browser" + name field + Join) with a large preview canvas and a name-tag-like element. Must NOT be in-call. Modelled DOM. -->
<html><head><title>zoom-webinar-joinpage</title></head>
<body>
  <h2>Join from browser</h2>
  <canvas width="640" height="360" style="width:640px;height:360px"></canvas>
  <div class="video-avatar__avatar-footer" style="width:120px;height:20px">Bot</div>
  <input id="input-for-name" placeholder="Your Name" style="width:200px;height:30px">
  <button style="width:80px;height:30px">Join</button>
</body></html>
