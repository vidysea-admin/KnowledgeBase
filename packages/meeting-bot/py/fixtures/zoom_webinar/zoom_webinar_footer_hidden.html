<!doctype html>
<!-- zoomwebinar: attendee view with the footer auto-hidden: only the share canvas and the name-tag overlay remain. Modelled DOM. -->
<html><head><title>zoom-webinar-footer-hidden</title></head>
<body style="margin:0;background:#000">
  <canvas id="sharing-canvas" width="900" height="500" style="width:900px;height:500px"></canvas>
  <div class="video-avatar__avatar-footer" style="width:120px;height:20px">100x Engineers</div>
  <footer id="wc-footer" style="display:none"><button aria-label="Q&amp;A" style="width:50px;height:40px">Q&amp;A</button></footer>
</body></html>
