<!doctype html>
<!-- zoomwebinar: Zoom web-client WEBINAR attendee view modelled on the live capture of 2026-10-13 (presenter share + "100x Engineers" name tag, no mic/camera controls, text-only Leave). Modelled DOM, not a saved page. -->
<html><head><title>zoom-webinar-attendee</title></head>
<body style="margin:0;background:#000">
  <div class="sharee-container" style="width:900px;height:500px"><canvas id="sharing-canvas" width="900" height="500" style="width:900px;height:500px"></canvas></div>
  <div class="video-avatar__avatar-footer" style="width:120px;height:20px">100x Engineers</div>
  <footer id="wc-footer" style="width:600px;height:50px">
    <button class="footer-button__button" aria-label="Q&amp;A" style="width:50px;height:40px">Q&amp;A</button>
    <button class="footer-button__button" aria-label="Chat" style="width:50px;height:40px">Chat</button>
    <button class="footer-button__button" aria-label="Raise Hand" style="width:50px;height:40px">Raise Hand</button>
    <button class="footer__leave-btn" style="width:50px;height:40px">Leave</button>
  </footer>
</body></html>
