# Cloud Build config for the Knowledge Base on Cloud Run (D-227, contract qa/contracts/cloud-build-deploy.md).
# Builds the root Dockerfile twice (web nginx and api targets), pushes both, and updates BOTH containers of the
# `vidysea-knowledgebase` service in ONE revision. Nothing else on the service is touched: no env, secrets,
# resources, scaling, traffic flags or service account. Secrets are never referenced here.
# Replaces the trigger's inline four-step config (pull :latest, one api-only build, push, single-image update), which
# on a master push would drop the web container. The trigger is NOT pointed at this file by the repo; that is an
# operator step. Structural test: scripts/operations/cloudbuild.test.mjs.
#
# Substitutions the trigger already supplies: REPO_NAME, _AR_HOSTNAME, _AR_PROJECT_ID, _AR_REPOSITORY,
# _DEPLOY_REGION, _SERVICE_NAME, _TRIGGER_ID. Every underscore substitution below carries a default.
# Optional (defaults keep today's behaviour): _REVISION_TAG (traffic tag for the new revision) and
# _NO_TRAFFIC ("true" deploys without routing traffic). Both set => a tagged, no-traffic throwaway deploy.
# Images: <_SERVICE_NAME>-web:<sha> (web container), <_SERVICE_NAME>:<sha> (api container). The api image also keeps the
# :latest tag the inline config applies today (cache source, never deployed); no new mutable tag is added.
steps:
  - id: Pull
    name: gcr.io/cloud-builders/docker
    entrypoint: /bin/bash
    args:
      - -c
      - docker pull $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest || exit 0
  - id: BuildWeb
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - web
      - --build-arg
      - TARGETARCH=amd64
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME-web:$COMMIT_SHA
      - -f
      - Dockerfile
      - .
  - id: BuildAPI
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - api
      - --build-arg
      - TARGETARCH=amd64
      - --cache-from
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - -f
      - Dockerfile
      - .
  - id: PushWeb
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME-web
  - id: PushAPI
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME
  # One `services update`, two containers (container names verified on revision vidysea-knowledgebase-00020-7ss:
  # web, api). Flags that are not container-specific must precede --container (gcloud run services update --help).
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: /bin/bash
    args:
      - -c
      - |
        set -eu
        extra=()
        if [ -n "$_REVISION_TAG" ]; then extra+=("--tag=$_REVISION_TAG"); fi
        if [ "$_NO_TRAFFIC" = "true" ]; then extra+=("--no-traffic"); fi
        gcloud run services update "$_SERVICE_NAME" \
          --region="$_DEPLOY_REGION" \
          --update-labels="managed-by=gcp-cloud-build-deploy-cloud-run,gcb-trigger-id=$_TRIGGER_ID,gcb-trigger-region=$LOCATION,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID" \
          --quiet \
          $${extra[@]+"$${extra[@]}"} \
          --container=web \
          --image="$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME-web:$COMMIT_SHA" \
          --container=api \
          --image="$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA"
images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME-web:$COMMIT_SHA
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  substitutionOption: ALLOW_LOOSE
substitutions:
  _AR_HOSTNAME: asia-south1-docker.pkg.dev
  _AR_PROJECT_ID: vidysea-prod
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: asia-south1
  _SERVICE_NAME: vidysea-knowledgebase
  _TRIGGER_ID: manual
  _REVISION_TAG: ''
  _NO_TRAFFIC: 'false'
tags:
  - gcp-cloud-build-deploy-cloud-run
  - vidysea-knowledgebase
